[package]
name = "damage-numbers"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[dependencies]
forge = { package = "mhgu-forge", path = "vendor/forge-rs/forge", features = ["imgui", "config"] }
damage-numbers-core = { path = "core" }
log = { version = "0.4", default-features = false }

[workspace]
members = ["core"]
exclude = ["vendor/forge-rs", "tests/config-harness", "tests/sys-host", "tests/render-harness", "tests/hooks-harness"]

[profile.release]
opt-level = 2
panic = "abort"
